name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Contrast (WCAG AA tokens)
        run: npm run check:contrast
      - name: Static accessibility checks
        run: npm run check:a11y
      - name: Committed-secret scan
        run: npm run scan:secrets
      - name: Build
        run: npm run build
      - name: Bundle report
        run: npm run report:bundle
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      # The live RLS boundary audit needs a private connection string:
      #   - name: RLS boundary audit
      #     run: npm run audit:rls
      #     env:
      #       DATABASE_URL: ${{ secrets.SUPABASE_AUDIT_DATABASE_URL }}
